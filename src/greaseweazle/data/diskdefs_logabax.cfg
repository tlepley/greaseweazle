# prefix: logabax.
# Logabax LX500 hard-sectored FM, exploration profile.
disk lx500.ss
    cyls = 40
    heads = 1
    tracks * logabax
        secs = 10
        img_bps = 256
    end
end

disk lx500.ds
    cyls = 40
    heads = 2
    tracks * logabax
        secs = 10
        img_bps = 256
        sync_prezero_bits = 10
    end
end


# Experimental alternate Logabax LX variant:
# Shorter zero preamble followed by 80 80 80 sync bytes.
disk lx80.ss
    cyls = 40
    heads = 1
    tracks * logabax
        secs = 10
        img_bps = 256
        sync = 80 80 80
        sync_prezero_bits = 40
        header_skip_bytes = 3
        header_mark = none
        track_id_offs = 0
        sector_id_offs = 1
        debug = True
    end
end
